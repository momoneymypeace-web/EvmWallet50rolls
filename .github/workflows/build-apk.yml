      - name: Inspect project
        run: |
          echo "=== PROJECT ==="
          pwd
          echo "=== TOP LEVEL ==="
          ls -la
          echo "=== GRADLE FILES ==="
          find . -maxdepth 4 -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "gradle.properties" \
          \) -print

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --info 2>&1 | tee gradle-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
